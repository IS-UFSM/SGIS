# Blueprint do Render: https://render.com/docs/blueprint-spec
# Cria o banco Postgres e o web service Django, ambos no plano gratuito.

databases:
  - name: sgis-db
    plan: free
    databaseName: sgis
    user: sgis

services:
  - type: web
    name: sgis
    runtime: python
    plan: free
    # O plano free não tem pre-deploy command, então as migrações rodam no build.
    buildCommand: >-
      pip install -r requirements.txt &&
      python manage.py collectstatic --no-input &&
      python manage.py migrate --no-input
    startCommand: gunicorn sgis.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sgis-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 2
      - key: IS_EMAIL
        sync: false
      - key: IS_SENHA_INICIAL
        sync: false
