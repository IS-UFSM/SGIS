<!DOCTYPE html>
<html lang="pt-br" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block titulo %}SGIS{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              DEFAULT: '#1a6b4f',
              hover: '#145a42',
              light: '#e8f5e9',
            }
          }
        }
      }
    }
  </script>
  {# TXT-01: mini editor de texto formatado. Versão fixada; a limpeza é sempre no servidor (RN-19). #}
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/trix@2.1.19/dist/trix.css">
  <script src="https://cdn.jsdelivr.net/npm/trix@2.1.19/dist/trix.umd.min.js"></script>
  <script>
    if (window.Trix) {
      Object.assign(Trix.config.lang, {
        bold: 'Negrito', italic: 'Itálico', link: 'Link', bullets: 'Lista',
        numbers: 'Lista numerada', urlPlaceholder: 'Cole o endereço (https://…)',
        unlink: 'Desfazer link', captionPlaceholder: 'Legenda',
      });
    }
    // TXT-01: sem anexos (imagens e arquivos).
    document.addEventListener('trix-file-accept', function (evento) { evento.preventDefault(); });
  </script>
  <style>
    /* TXT-01: só negrito, itálico, link e listas. */
    trix-toolbar .trix-button-group--file-tools,
    trix-toolbar .trix-button-group--history-tools,
    trix-toolbar [data-trix-attribute="strike"],
    trix-toolbar [data-trix-attribute="heading1"],
    trix-toolbar [data-trix-attribute="quote"],
    trix-toolbar [data-trix-attribute="code"],
    trix-toolbar [data-trix-action="decreaseNestingLevel"],
    trix-toolbar [data-trix-action="increaseNestingLevel"] { display: none; }
    trix-editor.trix-sgis {
      min-height: 8rem; background: #fff; border: 1px solid #cbd5e1;
      border-radius: 0.5rem; padding: 0.625rem 0.875rem; font-size: 0.875rem;
    }
    trix-editor.trix-sgis:focus { outline: 2px solid #1a6b4f; outline-offset: 1px; }
    /* O Tailwind zera listas e links; o texto formatado os devolve. */
    .texto-formatado ul { list-style: disc; padding-left: 1.25rem; }
    .texto-formatado ol { list-style: decimal; padding-left: 1.25rem; }
    .texto-formatado a { color: #1a6b4f; text-decoration: underline; }
    .texto-formatado p + p { margin-top: 0.5rem; }
  </style>
</head>
<body class="min-h-full font-sans antialiased text-slate-800 bg-slate-50 flex flex-col {% block body_class %}{% endblock %}">
  {% block conteudo %}{% endblock %}
  <script>
    document.querySelectorAll('[data-mostrar-senha]').forEach(function (botao) {
      botao.addEventListener('click', function () {
        var campo = document.getElementById(botao.dataset.mostrarSenha);
        if (!campo) return;

        var mostrando = campo.type === 'text';
        campo.type = mostrando ? 'password' : 'text';
        botao.setAttribute('aria-label', mostrando ? 'Mostrar senha' : 'Ocultar senha');
        botao.setAttribute('title', mostrando ? 'Mostrar senha' : 'Ocultar senha');
        botao.setAttribute('aria-pressed', String(!mostrando));
        botao.querySelector('[data-icone-senha="fechado"]').classList.toggle('hidden', !mostrando);
        botao.querySelector('[data-icone-senha="aberto"]').classList.toggle('hidden', mostrando);
      });
    });
  </script>
</body>
</html>
